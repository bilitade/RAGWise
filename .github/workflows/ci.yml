name: CI

# Ruff/pytest paths are `app/` and `tests/` at the repo root — not under `frontend/`.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.x"

      - name: Python sync
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check app tests

      - name: Pytest
        run: uv run pytest -q

      - name: pip-audit (locked prod deps)
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/requirements-audit.txt
          uvx pip-audit -r /tmp/requirements-audit.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run ci
