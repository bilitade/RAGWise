name: Deploy

on:
  push:
    branches: [main]

jobs:

  build-and-push:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ragwise:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ragwise:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ragwise-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ragwise-frontend:${{ github.sha }}


  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /opt/ragwise

            echo "${{ secrets.DOCKERHUB_TOKEN }}" \
              | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export RAGWISE_TAG=${{ github.sha }}

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            echo "Deploy complete — ${{ github.sha }}"
